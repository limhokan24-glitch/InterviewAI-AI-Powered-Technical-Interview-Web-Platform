# API load balancer: round-robins across backend replicas. WebSocket state is
# shared via Redis pub/sub, so no sticky sessions are required — any replica can
# serve any client and broadcasts still reach everyone.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream backend_pool {
  # Shared-memory zone so round-robin state is consistent across nginx workers
  # (without it, each worker counts independently and skews to the first server).
  zone backend_pool 64k;
  server backend1:4000;
  server backend2:4000;
}

server {
  listen 80;
  server_name _;

  location / {
    proxy_pass http://backend_pool;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # WebSocket upgrade
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
