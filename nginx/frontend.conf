# Frontend nginx: serves the SPA and proxies API + WebSocket to the load balancer
# (so the browser talks to a single same-origin host — no CORS needed).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # REST API → API load balancer
  location /api/ {
    proxy_pass http://lb:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # WebSocket → load balancer (with upgrade headers)
  location /ws {
    proxy_pass http://lb:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  # SPA fallback — every other path serves index.html (client-side routing)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
